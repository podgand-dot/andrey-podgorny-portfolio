<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f7f6f1; }
    .ring { fill: none; stroke: rgba(227,138,54,.6); stroke-width: 2.5; }
    .inner { fill: none; stroke: rgba(216,126,45,.1); stroke-width: 6; }
    .text { fill: #d87e2d; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111b25; }
      .inner { stroke: rgba(242,160,78,.1); }
      .text { fill: #f2a04e; }
    }
  </style>
  <circle class="bg" cx="32" cy="32" r="30.5"/>
  <circle class="inner" cx="32" cy="32" r="27.5"/>
  <circle class="ring" cx="32" cy="32" r="30.5"/>
  <text class="text" x="32" y="33" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing=".75">AP</text>
</svg>
