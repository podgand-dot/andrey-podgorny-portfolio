<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Сертификаты, награды и рекомендации Андрея Подгорного">
  <title>Сертификаты и награды • Андрей Подгорный</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111b25" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Сертификаты и награды • Андрей Подгорный">
  <meta property="og:description" content="Сертификаты, награды и рекомендации Андрея Подгорного">
  <meta property="og:image" content="assets/profile/profile.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/redesign.css">
  <link rel="stylesheet" href="css/secondary.css">
  <script src="js/page-utils.js" defer></script>
  <script src="js/data-store.js" defer></script>
  <script src="js/certificates.js" defer></script>
  <script src="js/lightbox.js" defer></script>
  <script src="js/motion.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <header class="navbar">
    <div class="container nav-container">
      <a class="nav-brand" href="index.html">
        <span class="brand-monogram" aria-hidden="true">AP</span>
        <span>Андрей Подгорный</span>
      </a>
      <nav class="page-nav" aria-label="Основная навигация">
        <a href="index.html#projects">Проекты</a>
        <a href="certificates.html" aria-current="page">Сертификаты</a>
        <a href="experience.html">Опыт работы</a>
        <a href="index.html#cv">CV</a>
      </nav>
      <div class="nav-actions">
        <button class="btn-icon" id="themeToggleBtn" type="button" aria-label="Сменить тему оформления" title="Сменить тему оформления">
          <span id="themeIcon" aria-hidden="true"><svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container detail-page" id="main" tabindex="-1">
    <div class="detail-kicker">Подтверждения</div>
    <h1>Сертификаты и награды</h1>
    <p class="detail-lead">Документы об олимпиадах, проектах, обучении и рекомендациях. Откройте карточку, чтобы посмотреть документ и описание.</p>

    <div class="cert-gallery-tools">
      <label class="search-wrap">
        <span class="sr-only">Поиск</span>
        <input id="certSearch" type="search" placeholder="Поиск по названию, организации или году" autocomplete="off" aria-controls="certificatesGrid">
      </label>
      <div class="cert-filter-row" role="group" aria-label="Категории">
        <button type="button" class="btn btn-sm cert-filter-btn active" data-category="all" aria-pressed="true" aria-controls="certificatesGrid">Все</button>
        <button type="button" class="btn btn-sm cert-filter-btn" data-category="business" aria-pressed="false" aria-controls="certificatesGrid">Бизнес</button>
        <button type="button" class="btn btn-sm cert-filter-btn" data-category="projects" aria-pressed="false" aria-controls="certificatesGrid">Проекты</button>
        <button type="button" class="btn btn-sm cert-filter-btn" data-category="olympiads" aria-pressed="false" aria-controls="certificatesGrid">Олимпиады</button>
        <button type="button" class="btn btn-sm cert-filter-btn" data-category="education" aria-pressed="false" aria-controls="certificatesGrid">Образование</button>
      </div>
    </div>

    <div class="certificates-grid" id="certificatesGrid"></div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <a href="index.html">← На главную</a>
    </div>
  </footer>

  <div class="modal-backdrop" id="lightboxModal" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" aria-describedby="lightboxDescription" tabindex="-1">
    <div class="lightbox-container">
      <div class="lightbox-img-wrap">
        <img id="lightboxImg" class="lightbox-img" alt="" decoding="async">
        <iframe id="lightboxFrame" class="lightbox-frame" title="Документ сертификата" hidden></iframe>
        <button type="button" class="lightbox-nav lightbox-nav-prev" id="lightboxPrevBtn" aria-label="Предыдущий сертификат" hidden><span aria-hidden="true">‹</span></button>
        <button type="button" class="lightbox-nav lightbox-nav-next" id="lightboxNextBtn" aria-label="Следующий сертификат" hidden><span aria-hidden="true">›</span></button>
      </div>
      <div class="lightbox-details">
        <div class="lightbox-text">
          <h2 class="lightbox-title" id="lightboxTitle"></h2>
          <p class="lightbox-sub" id="lightboxSub"></p>
          <p class="lightbox-description" id="lightboxDescription"></p>
          <div class="cert-award-pill" id="lightboxAward" style="display:none"></div>
        </div>
        <div class="detail-actions">
          <a href="#" id="lightboxDownloadBtn" download class="btn btn-sm btn-primary">Скачать</a>
          <button type="button" class="btn btn-sm btn-secondary" id="lightboxCloseBtn">Закрыть</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
