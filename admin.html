<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление сертификатами • локально</title><script src="js/theme.js"></script><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/redesign.css"></head><body><main class="container detail-page admin-page"><a class="back-link" href="/">← На сайт</a><div class="detail-kicker">Локальная панель</div><h1>Сертификаты</h1><p class="detail-lead">Панель доступна только при запуске сайта на этом компьютере через <code>npm start</code>. После сохранения файлы и описания обновляются в проекте.</p><form id="certForm" class="detail-panel"><input type="hidden" id="certId"><label>Файл сертификата<input id="certFile" type="file" accept="image/png,image/jpeg,image/webp,application/pdf"></label><div class="form-grid"><label>Название *<input id="certTitle" required maxlength="180"></label><label>Организация *<input id="certIssuer" required maxlength="180"></label><label>Категория<select id="certCategory"><option value="business">Бизнес и консалтинг</option><option value="projects">Проекты</option><option value="olympiads">Олимпиады</option><option value="education">Образование и курсы</option></select></label><label>Дата или год<input id="certDate" placeholder="2026 или 2026-11-07"></label><label>Результат / награда<input id="certAward" maxlength="180"></label><label>Навыки через запятую<input id="certSkills"></label><label class="full-width">Описание<textarea id="certDescription" rows="4" maxlength="4000" required></textarea></label></div><div class="detail-actions"><button class="btn btn-primary" id="saveCert" type="submit">Сохранить сертификат</button><button class="btn btn-secondary" id="cancelEdit" type="button" hidden>Отменить редактирование</button></div><p id="adminMessage" role="status"></p></form><h2>Добавленные сертификаты</h2><div id="adminCertList"></div></main><script src="js/admin.js"></script><script src="js/motion.js"></script></body></html>
